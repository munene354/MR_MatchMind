<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>M.R MatchMind - Login</title>

<style>
* {
  box-sizing: border-box;
}

body {
  margin: 0;
  font-family: Arial, sans-serif;
  background: #06111d;
  color: #f5f7fa;
}

header {
  height: 86px;
  display: flex;
  align-items: center;
  padding: 0 30px;
  background: #071522;
  border-bottom: 1px solid #1b3045;
}

.logo {
  font-size: 28px;
  font-weight: bold;
}

.logo span {
  color: #168cff;
}

.container {
  max-width: 570px;
  margin: 245px auto 60px;
  padding: 0 20px;
}

.card {
  background: #0d1d2f;
  border: 1px solid #1b354f;
  border-radius: 22px;
  padding: 38px 30px;
  box-shadow: 0 10px 35px rgba(0,0,0,0.25);
}

.brain {
  text-align: center;
  font-size: 55px;
  margin-bottom: 12px;
}

h1 {
  text-align: center;
  margin: 0 0 10px;
  font-size: 34px;
}

.subtitle {
  text-align: center;
  color: #8fa1b5;
  font-size: 17px;
  margin-bottom: 35px;
}

.tabs {
  display: flex;
  background: #0a1a2b;
  border-radius: 12px;
  padding: 5px;
  margin-bottom: 30px;
}

.tab {
  flex: 1;
  padding: 16px;
  border: none;
  background: transparent;
  color: #91a3b7;
  font-size: 18px;
  font-weight: bold;
  border-radius: 9px;
  cursor: pointer;
}

.tab.active {
  background: #168cff;
  color: white;
}

label {
  display: block;
  margin-bottom: 9px;
  color: #aebdcb;
  font-size: 16px;
}

input {
  width: 100%;
  padding: 17px;
  margin-bottom: 22px;
  border-radius: 11px;
  border: 1px solid #29445e;
  background: #071522;
  color: white;
  font-size: 16px;
  outline: none;
}

input:focus {
  border-color: #168cff;
}

.submit {
  width: 100%;
  padding: 17px;
  border: none;
  border-radius: 11px;
  background: #168cff;
  color: white;
  font-size: 18px;
  font-weight: bold;
  cursor: pointer;
}

.submit:disabled {
  opacity: 0.6;
  cursor: wait;
}

.message {
  display: none;
  margin-top: 18px;
  padding: 14px;
  border-radius: 9px;
  text-align: center;
  background: #17283a;
  color: #dce7f2;
}

.pro-note {
  margin-top: 28px;
  padding: 17px;
  border: 1px solid #705b16;
  border-radius: 11px;
  background: #17170e;
  color: #c9c09a;
  text-align: center;
}

.back {
  display: block;
  text-align: center;
  margin-top: 30px;
  color: #72b8ff;
  text-decoration: underline;
}

@media (max-width: 600px) {
  header {
    padding: 0 20px;
  }

  .logo {
    font-size: 24px;
  }

  .container {
    margin-top: 180px;
  }

  .card {
    padding: 30px 20px;
  }

  h1 {
    font-size: 30px;
  }
}
</style>
</head>

<body>

<header>
  <div class="logo">⚽ M.R <span>MatchMind</span></div>
</header>

<div class="container">

  <div class="card">

    <div class="brain">🧠</div>

    <h1>Welcome to MatchMind</h1>

    <div class="subtitle">
      Sign in or create your M.R MatchMind account.
    </div>

    <div class="tabs">
      <button id="loginTab" class="tab active">Login</button>
      <button id="signupTab" class="tab">Sign Up</button>
    </div>

    <form id="authForm">

      <label for="email">Email address</label>

      <input
        id="email"
        type="email"
        placeholder="you@example.com"
        required
      >

      <label for="password">Password</label>

      <input
        id="password"
        type="password"
        placeholder="Enter password"
        required
      >

      <button id="submitButton" class="submit" type="submit">
        Login
      </button>

    </form>

    <div id="message" class="message"></div>

    <div class="pro-note">
      🔒 Pro subscriptions will be connected after the account
      system and payment infrastructure are securely configured.
    </div>

    <a class="back" href="index.html">
      ← Back to MatchMind
    </a>

  </div>

</div>

<!-- Supabase library -->
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script>

const SUPABASE_URL = "https://vvotpujbkaigszgocspy.supabase.co";
const SUPABASE_ANON_KEY = "sb_publishable_uG2muoZadTbcYXoDNk6usw_Fu0LqEWM";

let supabaseClient = null;

try {
  supabaseClient = window.supabase.createClient(
    SUPABASE_URL,
    SUPABASE_ANON_KEY
  );
} catch (error) {
  console.error("Supabase initialization error:", error);
}

const loginTab = document.getElementById("loginTab");
const signupTab = document.getElementById("signupTab");
const authForm = document.getElementById("authForm");
const submitButton = document.getElementById("submitButton");
const message = document.getElementById("message");

let mode = "login";

function showMessage(text) {
  message.style.display = "block";
  message.textContent = text;
}

loginTab.addEventListener("click", function() {

  mode = "login";

  loginTab.classList.add("active");
  signupTab.classList.remove("active");

  submitButton.textContent = "Login";

  message.style.display = "none";

});

signupTab.addEventListener("click", function() {

  mode = "signup";

  signupTab.classList.add("active");
  loginTab.classList.remove("active");

  submitButton.textContent = "Create Account";

  message.style.display = "none";

});

authForm.addEventListener("submit", async function(event) {

  event.preventDefault();

  const email = document.getElementById("email").value.trim();
  const password = document.getElementById("password").value;

  if (!supabaseClient) {
    showMessage("Supabase connection is not configured correctly.");
    return;
  }

  submitButton.disabled = true;
  submitButton.textContent = "Please wait...";

  try {

    if (mode === "signup") {

      const { error } = await supabaseClient.auth.signUp({
        email: email,
        password: password
      });

      if (error) {
        showMessage(error.message);
      } else {
        showMessage(
          "Account created! Check your email if confirmation is required."
        );
      }

      submitButton.disabled = false;
      submitButton.textContent = "Create Account";

    } else {

      const { error } =
        await supabaseClient.auth.signInWithPassword({
          email: email,
          password: password
        });

      if (error) {

        showMessage(error.message);

        submitButton.disabled = false;
        submitButton.textContent = "Login";

        return;
      }

      showMessage("Login successful!");

      setTimeout(function() {
        window.location.href = "index.html";
      }, 800);

    }

  } catch (error) {

    showMessage("Something went wrong. Please try again.");

    submitButton.disabled = false;

    submitButton.textContent =
      mode === "signup" ? "Create Account" : "Login";

    console.error(error);

  }

});

</script>

</body>
</html>
